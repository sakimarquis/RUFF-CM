[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruff_cm"
version = "0.3.0"
description = "Reusable Utility Functions for Computational Modeling"
authors = [{name = "Hua-Dong Xiong", email = "hdx@arizona.edu"}]
readme = "README.md"
license = {text = "See LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml", "ruamel.yaml", "submitit", "torch", "tensorboard", "wandb", "matplotlib", "scipy", "scikit-learn", "joblib", "httpx>=0.24"]

[project.optional-dependencies]
llm = ["openai>=1.0", "transformers>=4.40", "tiktoken", "peft>=0.10", "httpx>=0.24"]
eval = ["datasets>=2.18"]
llm-google = ["google-genai>=1.0"]
llm-anthropic = ["anthropic[vertex]>=0.40"]
dev = ["pytest>=7", "pytest-cov", "pytest-mock", "ruff", "openai>=1.0", "transformers>=4.40", "tiktoken", "peft>=0.10", "httpx>=0.24", "datasets>=2.18"]

[tool.setuptools.packages.find]
include = ["ruff_cm*"]

[tool.setuptools.package-data]
"ruff_cm.llm.backends" = ["model_aliases.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hf: tests requiring torch and transformers",
    "api: API backend tests using a mocked OpenAI-compatible client",
    "parity: copied tiny parity fixtures from downstream repos",
    "live_sglang: opt-in tests against a live SGLang server",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
